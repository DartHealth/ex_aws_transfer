name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - otp: "28.1"
            elixir: "1.19"

          - otp: "28.1"
            elixir: "1.18"

          - otp: "27.3"
            elixir: "1.18"

          - otp: "27.3"
            elixir: "1.17"

          - otp: "26.2"
            elixir: "1.18"

          - otp: "26.2"
            elixir: "1.17"

          - otp: "26.2"
            elixir: "1.16"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plts-${{ matrix.otp }}-${{ matrix.elixir }}
          restore-keys: |
            ${{ runner.os }}-plts-

      - name: Install deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Dialyzer
        run: mix dialyzer --halt-exit-status
